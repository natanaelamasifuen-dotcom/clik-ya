<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clik Ya | 2 Lentes TR90</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .contenedor {
            max-width: 700px;
            margin: 0 auto;
            padding: 25px 18px 40px;
        }

        .marca {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .producto {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .producto h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitulo {
            font-size: 18px;
            color: #666;
            margin-bottom: 25px;
        }

        .producto img {
            width: 100%;
            max-width: 430px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .precio {
            font-size: 42px;
            font-weight: bold;
            margin: 10px 0;
        }

        .oferta {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            background: #111;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 16px 35px;
            border-radius: 12px;
            transition: 0.2s;
        }

        .boton:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .confianza {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .item {
            background: white;
            border-radius: 14px;
            padding: 18px 10px;
            text-align: center;
            font-size: 14px;
        }

        .icono {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .final {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .producto h1 {
                font-size: 29px;
            }

            .precio {
                font-size: 36px;
            }

            .confianza {
                grid-template-columns: 1fr;
            }

            .boton {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="marca">
            Clik Ya
        </div>

        <div class="producto">

            <h1>2 Lentes TR90</h1>

            <p class="subtitulo">
                Llévate 2 unidades en un solo pedido.
            </p>

            <img
                src="2 LENTES TR90.png"
                alt="Combo de 2 lentes TR90"
            >

            <div class="precio">
                S/ 159
            </div>

            <div class="oferta">
                2 unidades por S/159
            </div>

            <a
                class="boton"
                href="https://wa.me/51941841063?text=Hola%2C%20quiero%20comprar%20el%20combo%20de%202%20lentes%20TR90%20por%20S%2F159"
                target="_blank"
            >
                Comprar ahora
            </a>

        </div>

        <div class="confianza">

            <div class="item">
                <div class="icono">👓</div>
                <strong>2 unidades</strong>
                <br>
                Un solo pedido
            </div>

            <div class="item">
                <div class="icono">🚚</div>
                <strong>Envíos</strong>
                <br>
                A todo el Perú
            </div>

            <div class="item">
                <div class="icono">💬</div>
                <strong>Atención</strong>
                <br>
                Por WhatsApp
            </div>

        </div>

        <div class="final">
            Clik Ya — compra fácil, elige lo que va contigo.
        </div>

    </div>

</body>
</html>
